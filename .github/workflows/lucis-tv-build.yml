name: Build Lucis TV APK
on:
  push:
    branches: [ lucis-tv-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: lucis-tv
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        working-directory: lucis-tv
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        run: cp lucis-tv/app/build/outputs/apk/debug/app-debug.apk Lucis-TV-EA55-v0.3.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lucis-TV-EA55-v0.3.0
          path: Lucis-TV-EA55-v0.3.0.apk
          if-no-files-found: error
