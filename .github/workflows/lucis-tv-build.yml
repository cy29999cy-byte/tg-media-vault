name: Build Lucis TV APK\non:\n  push:\n    branches: [ lucis-tv-build ]\n  workflow_dispatch:\n\npermissions:\n  contents: write\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - uses: actions/setup-java@v5\n        with:\n          distribution: temurin\n          java-version: '17'\n\n      - uses: gradle/actions/setup-gradle@v4\n        with:\n          gradle-version: '8.7'\n\n      - name: Restore stable TV signing key\n        uses: actions/cache@v4\n        with:\n          path: ~/.android/debug.keystore\n          key: lucis-tv-ea55-debug-signing-v1\n\n      - name: Build APK\n        working-directory: lucis-tv\n        run: gradle --no-daemon assembleDebug\n\n      - name: Verify APK\n        working-directory: lucis-tv\n        run: |\n          test -f app/build/outputs/apk/debug/app-debug.apk\n          unzip -t app/build/outputs/apk/debug/app-debug.apk\n          sha256sum app/build/outputs/apk/debug/app-debug.apk\n\n      - name: Prepare APK\n        run: cp lucis-tv/app/build/outputs/apk/debug/app-debug.apk Lucis-TV-EA55.apk\n\n      - uses: actions/upload-artifact@v4\n        with:\n          name: Lucis-TV-EA55-v2.1.0\n          path: Lucis-TV-EA55.apk\n          if-no-files-found: error\n\n      - name: Publish rolling TV update\n        env:\n          GH_TOKEN: ${{ github.token }}\n        run: |\n          gh release delete lucis-tv-latest --cleanup-tag -y || true\n          git tag -f lucis-tv-latest\n          git push origin -f refs/tags/lucis-tv-latest\n          gh release create lucis-tv-latest Lucis-TV-EA55.apk --title "Lucis TV 2.1.0" --notes "EA55 实机修复版：平台客户端桥接、港片直播聚合、安全区 UI 修复与在线更新。"\n